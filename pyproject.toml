[project]
name = "softmaxlint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Andersen", email = "cdandersen98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
]

[project.scripts]
softmaxlint = "softmaxlint:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # missing-trailing-comma
  "T20",    # flake8-print
  "ERA",    # eradicate
  "D",      # docstrings
  "CPY",    # copyright
]

[tool.ruff.lint.pydocstyle]
convention = "google"
