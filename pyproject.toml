[project]
name = "softmaxlint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Andersen", email = "cdandersen98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "compressed-tensors>=0.19.0",
    "openai>=3.22.1",
    "pathspec>=1.1.1",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
softmaxlint = "softmaxlint:main"

# Only needed by scripts/spike_diffusion_scorer.py, which evaluates whether
# DiffusionGemma's bidirectional canvas can replace FIM prompting. Kept out of
# the runtime dependencies on purpose: the linter itself talks over HTTP and
# needs none of this.
[project.optional-dependencies]
spike = [
  "accelerate>=1.10",
  "bitsandbytes>=0.48",
  "compressed-tensors>=0.15.0",
  "torch>=2.9",
  "transformers>=5.5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
[tool.ruff]
line-length = 120
# Calibration fixtures. Deliberately plain, unannotated Python that stands in
# for real-world source, so it must not be held to this project's own rules.
extend-exclude = ["corpus"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # missing-trailing-comma
  "T20",    # flake8-print
  "ERA",    # eradicate
  "D",      # docstrings
  "CPY",    # copyright
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The spike scripts import their optional dependencies inside functions, so
# `--help` still works and a missing dependency gives a readable message rather
# than a traceback at import time.
"scripts/spike_*.py" = ["PLC0415"]
"tests/**" = [
  "S101",    # assert
  "S105",    # hardcoded-password-string
  "S107",    # hardcoded-password-default
  "ANN401",  # dynamically-typed-expressions
  "PLR2004", # magic-value-comparison
  "TC001",   # typing-only-first-party-import
  "TC002",   # typing-only-third-party-import
  "TC003",   # typing-only-standard-library-import
]

[dependency-groups]
dev = [
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
