# Qwen2.5-Coder-7B, served for FIM scoring.
#
# Qwen3-family checkpoints declare <|fim_*|> tokens but were not trained for
# FIM: every hole scores '\n', which carries no signal. Qwen2.5-Coder fills
# FIM holes as expected; `just calibrate` measures FP ~1.2% of tokens and
# recall 3/4 seeded bug types against it.
#
#   just up
#   MODEL_NAME=coder-7b just calibrate
#   just down
services:
  softmaxlint:
    image: ghcr.io/syv-ai/hyperqwen:latest
    container_name: softmaxlint
    ipc: host
    # "single", not "batch". Batch mode is plain batching, but it OOMs on a 24 GB
    # card during engine init (22.9 GiB in use, 250 MiB free) -- the
    # single-user mode's int8-KV speculation patches are what make it fit here.
    command: single
    # Host networking, not a published port. The image detects whether it is
    # containerised via /.dockerenv and /proc/1/cgroup, and under podman both
    # come back negative -- so with no VLLM_API_KEY set it binds 127.0.0.1
    # inside the container. A published port forwards to the container's
    # external interface and can never reach a loopback listener, so sharing
    # the host network is what makes :18020 reachable at all.
    network_mode: host
    environment:
      # The image bakes in its own checkpoint; MODEL is what start_qwen.sh passes
      # straight to `vllm serve`. A Hub id resolves through the bind-mounted HF
      # cache below, so a warm cache is all this needs.
      MODEL: Qwen/Qwen2.5-Coder-7B
      EXTRA_ARGS: >-
        --gpu-memory-utilization 0.85 --max-model-len 8192
        --served-model-name coder-7b
      # Qwen2.5-Coder-7B has no multi-token-prediction head, so the image's default
      # speculative method cannot apply to it.
      SPEC: none
      # The image's verify.sh refuses to start unless lm_head and embed_tokens
      # have been requantized for its own int4 kernels. This checkpoint is a
      # plain bf16 model being scored for likelihoods, not served for speed,
      # so those checks do not apply.
      VERIFY: "0"
    devices:
      - "nvidia.com/gpu=all"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:z
      # The image's entrypoint downloads and requantizes its baked-in
      # checkpoint on first boot even though stage 3 serves MODEL above.
      # Bind-mounted so that download happens once, not on every recreate.
      - ~/.cache/hyperqwen/models:/app/models:z
    security_opt:
      - label=disable
