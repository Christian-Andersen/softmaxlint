# Experimental: serve TIGER-Lab/FIM-Mid-8B (Qwen3-8B + function-aware FIM
# mid-training) instead of the checkpoint HyperQwen bakes in.
#
# Separate from compose.yaml on purpose: that file is the working configuration
# and should stay untouched while this is being evaluated.
#
#   podman-compose -f compose.fim.yaml up -d
#   MODEL_NAME=fim-mid-8b just calibrate
#   podman-compose -f compose.fim.yaml down
services:
  softmaxlint_fim:
    image: ghcr.io/syv-ai/hyperqwen:latest
    container_name: softmaxlint_fim
    ipc: host
    # `single` again: batch OOMs on a 24 GB card.
    command: single
    network_mode: host
    environment:
      # The image bakes in its own checkpoint; MODEL is what start_qwen.sh passes
      # straight to `vllm serve`. It expects a path inside the container, so the
      # HF cache bind mount below is what makes this resolvable.
      MODEL: /root/.cache/huggingface/hub/models--TIGER-Lab--FIM-Mid-8B/snapshots/7f39fb452e7557852b9b846becf4fbad8a56eda6
      EXTRA_ARGS: >-
        --gpu-memory-utilization 0.85 --max-model-len 8192
        --served-model-name fim-mid-8b
      # Qwen3-8B has no multi-token-prediction head, so the image's default
      # speculative method cannot apply to it.
      SPEC: none
      # The image's verify.sh refuses to start unless lm_head and embed_tokens
      # have been requantized for its own int4 kernels. This checkpoint is a
      # plain bf16 Qwen3 dense model being scored for likelihoods, not served
      # for speed, so those checks do not apply.
      VERIFY: "0"
    devices:
      - "nvidia.com/gpu=all"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:z
    security_opt:
      - label=disable